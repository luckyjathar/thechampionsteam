<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>क्विझ ॲडमिन पॅनल - इमेज सपोर्ट</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Noto Sans Devanagari', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 flex justify-center items-center">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl my-4">
    <div class="border-b border-slate-700 pb-3 mb-4 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-amber-400">⚔️ क्विझ कंट्रोल पॅनल</h1>
        <p class="text-xs text-slate-400">बल्क व इमेज सपोर्ट</p>
      </div>
      <button onclick="toggleConfig()" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-200 transition">
        ⚙️ सेटिंग्ज
      </button>
    </div>

    <!-- GitHub Settings -->
    <div id="configBox" class="hidden bg-slate-950 border border-slate-700 rounded-xl p-3.5 mb-4 text-xs space-y-2.5">
      <div class="font-bold text-amber-400 border-b border-slate-800 pb-1">GitHub API कॉन्फिगरेशन</div>
      <div>
        <label class="block text-slate-400 mb-0.5">GitHub Username:</label>
        <input type="text" id="ghUser" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-400 mb-0.5">Repository Name:</label>
        <input type="text" id="ghRepo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-400 mb-0.5">GitHub PAT:</label>
        <input type="password" id="ghToken" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-100">
      </div>
      <button onclick="saveConfig()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 font-bold rounded-lg text-white">सेटिंग्ज सेव्ह करा</button>
    </div>

    <!-- Mode Selector -->
    <div class="grid grid-cols-2 gap-2 mb-4 bg-slate-950 p-1 rounded-xl border border-slate-700 text-xs font-semibold">
      <button id="tabBulkBtn" onclick="switchTab('bulk')" class="py-2 rounded-lg bg-amber-500 text-slate-950">📋 Bulk Paste</button>
      <button id="tabSingleBtn" onclick="switchTab('single')" class="py-2 rounded-lg text-slate-400 hover:text-slate-200">✏️ Single Form</button>
    </div>

    <!-- TAB 1: BULK PASTE -->
    <div id="bulkSection" class="space-y-3 text-xs">
      <div>
        <label class="block text-slate-300 font-semibold mb-1">सर्व प्रश्नांचा JSON कोड टाका:</label>
        <textarea id="bulkData" rows="10" placeholder='[{"tag": "क्लोजिंग", "situation": "...", "options": ["A","B","C","D"], "correct": 1, "character": "अर्जुन", "lesson": "...", "image": "https://..."}]' class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 font-mono text-[11px] text-amber-300 focus:outline-none"></textarea>
      </div>

      <div class="flex items-center gap-2 text-slate-300">
        <input type="radio" id="modeAppend" name="writeMode" value="append" checked class="accent-amber-400">
        <label for="modeAppend">नवीन प्रश्न पुढे जोडा (Append)</label>
      </div>
      <div class="flex items-center gap-2 text-slate-300">
        <input type="radio" id="modeOverwrite" name="writeMode" value="overwrite" class="accent-amber-400">
        <label for="modeOverwrite">आधीचे काढून हेच ठेवा (Overwrite)</label>
      </div>

      <button type="button" id="bulkSubmitBtn" onclick="submitBulkData()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow-lg mt-2">सर्व प्रश्न १-क्लिकवर सेव्ह करा 🚀</button>
    </div>

    <!-- TAB 2: SINGLE FORM -->
    <form id="singleSection" onsubmit="submitSingleQuestion(event)" class="hidden space-y-2.5 text-xs">
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">टॅग / विषय:</label>
        <input type="text" id="tag" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">फिल्डवरील परिस्थिती:</label>
        <textarea id="situation" rows="2" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100"></textarea>
      </div>
      <div class="space-y-1">
        <label class="block text-slate-300 font-semibold">पर्याय (A, B, C, D):</label>
        <input type="text" id="optA" placeholder="पर्याय A" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1 text-slate-100">
        <input type="text" id="optB" placeholder="पर्याय B" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1 text-slate-100">
        <input type="text" id="optC" placeholder="पर्याय C" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1 text-slate-100">
        <input type="text" id="optD" placeholder="पर्याय D" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">योग्य उत्तर:</label>
        <select id="correct" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100">
          <option value="0">पर्याय A</option>
          <option value="1">पर्याय B</option>
          <option value="2">पर्याय C</option>
          <option value="3">पर्याय D</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">पात्र (Character):</label>
        <input type="text" id="character" placeholder="उदा. अर्जुन" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">इमेज URL (पर्यायी):</label>
        <input type="url" id="imgUrl" placeholder="https://example.com/arjun.jpg" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100">
      </div>
      <div>
        <label class="block text-slate-300 font-semibold mb-0.5">धडा / स्पष्टीकरण:</label>
        <textarea id="lesson" rows="2" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-100"></textarea>
      </div>
      <button type="submit" id="singleSubmitBtn" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl mt-2">हा प्रश्न जोडा 🚀</button>
    </form>

    <div id="statusMsg" class="hidden mt-3 p-2.5 rounded-xl text-center text-xs font-semibold"></div>
  </div>

  <script>
    function init() {
      document.getElementById('ghUser').value = localStorage.getItem('gh_user') || 'luckyjathar';
      document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'thechampionsteam';
      document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
      if (!localStorage.getItem('gh_token')) document.getElementById('configBox').classList.remove('hidden');
    }
    function toggleConfig() { document.getElementById('configBox').classList.toggle('hidden'); }
    function saveConfig() {
      localStorage.setItem('gh_user', document.getElementById('ghUser').value.trim());
      localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
      document.getElementById('configBox').classList.add('hidden');
      showStatus("सेटिंग्ज सेव्ह झाल्या! ✅", "bg-emerald-950 text-emerald-300 border border-emerald-700");
    }
    function switchTab(t) {
      document.getElementById('bulkSection').classList.toggle('hidden', t !== 'bulk');
      document.getElementById('singleSection').classList.toggle('hidden', t === 'bulk');
      document.getElementById('tabBulkBtn').className = t === 'bulk' ? "py-2 rounded-lg bg-amber-500 text-slate-950" : "py-2 rounded-lg text-slate-400";
      document.getElementById('tabSingleBtn').className = t === 'single' ? "py-2 rounded-lg bg-amber-500 text-slate-950" : "py-2 rounded-lg text-slate-400";
    }
    function showStatus(t, c) {
      const el = document.getElementById('statusMsg');
      el.className = `mt-3 p-2.5 rounded-xl text-center text-xs font-semibold ${c}`;
      el.innerText = t; el.classList.remove('hidden');
    }

    async function commitToGitHub(updatedArray, successText, btn) {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      const token = localStorage.getItem('gh_token');
      if (!token) { alert("कृपया आधी सेटिंग्जमध्ये जाऊन टोकन भरा!"); toggleConfig(); return; }

      btn.disabled = true;
      showStatus("GitHub वर सेव्ह होत आहे...", "bg-slate-950 text-slate-300 border border-slate-700");
      const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/questions.json`;

      try {
        let fileSha = null;
        const getRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
        if (getRes.status === 200) { const d = await getRes.json(); fileSha = d.sha; }

        const jsonStr = JSON.stringify(updatedArray, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));

        const putRes = await fetch(apiUrl, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "Update questions with image support", content: encodedContent, sha: fileSha })
        });

        if (putRes.ok) {
          showStatus(successText, "bg-emerald-950 text-emerald-300 border border-emerald-700");
          return true;
        } else {
          const err = await putRes.json();
          throw new Error(err.message || "एरर आला.");
        }
      } catch (e) {
        showStatus(`त्रुटी: ${e.message}`, "bg-rose-950 text-rose-300 border border-rose-700");
        return false;
      } finally { btn.disabled = false; }
    }

    async function submitBulkData() {
      const raw = document.getElementById('bulkData').value.trim();
      const btn = document.getElementById('bulkSubmitBtn');
      if (!raw) return alert("कृपया JSON कोड टाका!");
      let parsed;
      try {
        parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) parsed = [parsed];
      } catch(e) { return alert("JSON कोड फॉरमॅट चुकीचा आहे!"); }

      let finalQ = parsed;
      if (document.getElementById('modeAppend').checked) {
        try {
          const getRes = await fetch(`https://api.github.com/repos/${localStorage.getItem('gh_user')}/${localStorage.getItem('gh_repo')}/contents/questions.json`, {
            headers: { 'Authorization': `Bearer ${localStorage.getItem('gh_token')}` }
          });
          if (getRes.status === 200) {
            const d = await getRes.json();
            const cur = JSON.parse(decodeURIComponent(escape(atob(d.content))));
            finalQ = [...cur, ...parsed];
          }
        } catch(e) {}
      }

      const ok = await commitToGitHub(finalQ, `यशस्वी! एकूण ${finalQ.length} प्रश्न सेव्ह झाले 🚀`, btn);
      if (ok) document.getElementById('bulkData').value = "";
    }

    async function submitSingleQuestion(e) {
      e.preventDefault();
      const btn = document.getElementById('singleSubmitBtn');
      const newQ = {
        tag: document.getElementById('tag').value.trim(),
        situation: document.getElementById('situation').value.trim(),
        options: [
          document.getElementById('optA').value.trim(),
          document.getElementById('optB').value.trim(),
          document.getElementById('optC').value.trim(),
          document.getElementById('optD').value.trim()
        ],
        correct: parseInt(document.getElementById('correct').value),
        character: document.getElementById('character').value.trim(),
        image: document.getElementById('imgUrl').value.trim() || "",
        lesson: document.getElementById('lesson').value.trim()
      };

      let cur = [];
      try {
        const getRes = await fetch(`https://api.github.com/repos/${localStorage.getItem('gh_user')}/${localStorage.getItem('gh_repo')}/contents/questions.json`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('gh_token')}` }
        });
        if (getRes.status === 200) {
          const d = await getRes.json();
          cur = JSON.parse(decodeURIComponent(escape(atob(d.content))));
        }
      } catch(e) {}

      cur.push(newQ);
      const ok = await commitToGitHub(cur, "प्रश्न इमेजसह सेव्ह झाला! 🚀", btn);
      if (ok) document.getElementById('singleSection').reset();
    }
    init();
  </script>
</body>
</html>
