<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>द चॅम्पियन्स टीम - क्विझ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Devanagari', sans-serif; }
    .animate-fadeIn { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-center p-3">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl relative">
    
    <!-- Top Bar -->
    <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800 text-xs">
      <span class="font-bold text-amber-400 tracking-wider">⚔️ द चॅम्पियन्स टीम</span>
      <span id="qCounter" class="bg-slate-800 px-2.5 py-1 rounded-full text-slate-300 font-semibold">१ / १</span>
    </div>

    <!-- Question View -->
    <div id="quizCard">
      <div id="qTag" class="inline-block bg-amber-400/10 text-amber-400 border border-amber-400/20 px-2.5 py-0.5 rounded-md text-[11px] font-bold mb-2"></div>
      <h2 id="qText" class="text-sm font-semibold leading-relaxed text-slate-100 mb-4"></h2>

      <!-- Options -->
      <div id="optionsList" class="space-y-2 text-xs"></div>

      <!-- Reveal Card with Image -->
      <div id="revealBox" class="hidden mt-4 bg-slate-950 border border-slate-800 rounded-2xl p-4 animate-fadeIn">
        <div id="imgContainer" class="hidden mb-3 overflow-hidden rounded-xl border border-slate-700">
          <img id="charImg" src="" alt="पात्र" class="w-full h-44 object-cover">
        </div>
        <div class="text-amber-400 font-bold text-xs mb-1" id="charTitle"></div>
        <p class="text-slate-300 text-[11px] leading-relaxed" id="charLesson"></p>
        
        <button id="nextBtn" onclick="nextQuestion()" class="w-full mt-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition">
          पुढचा प्रश्न ➔
        </button>
      </div>
    </div>

    <!-- Result View -->
    <div id="resultCard" class="hidden text-center py-6">
      <div class="text-3xl mb-2">🏆</div>
      <h3 class="text-lg font-bold text-amber-400 mb-1">क्विझ पूर्ण झाली!</h3>
      <p class="text-xs text-slate-400 mb-4" id="finalScore"></p>
      <button onclick="location.reload()" class="py-2.5 px-6 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl">
        पुन्हा खेळा 🔄
      </button>
    </div>

    <!-- Error/Loading -->
    <div id="loader" class="text-center py-10 text-xs text-slate-400">प्रश्न लोड होत आहेत...</div>
  </div>

  <script>
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    async function loadQuestions() {
      try {
        const res = await fetch('questions.json?v=' + Date.now());
        questions = await res.json();
        document.getElementById('loader').classList.add('hidden');

        if (questions && questions.length > 0) {
          showQuestion(0);
        } else {
          document.getElementById('quizCard').innerHTML = "<p class='text-center text-xs text-slate-400'>प्रश्न उपलब्ध नाहीत.</p>";
        }
      } catch (e) {
        document.getElementById('loader').innerText = "प्रश्न लोड करता आले नाहीत.";
      }
    }

    function showQuestion(index) {
      answered = false;
      const q = questions[index];
      document.getElementById('qCounter').innerText = `${index + 1} / ${questions.length}`;
      document.getElementById('qTag').innerText = q.tag;
      document.getElementById('qText').innerText = q.situation;
      document.getElementById('revealBox').classList.add('hidden');

      const list = document.getElementById('optionsList');
      list.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3 rounded-xl bg-slate-800/80 border border-slate-700/80 hover:border-amber-400/55 transition text-slate-200 leading-snug";
        btn.innerText = opt;
        btn.onclick = () => selectOption(i, btn);
        list.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, btn) {
      if (answered) return;
      answered = true;
      const q = questions[currentIndex];
      const buttons = document.getElementById('optionsList').children;

      if (selectedIndex === q.correct) {
        score++;
        btn.classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
      } else {
        btn.classList.add('bg-rose-950', 'border-rose-500', 'text-rose-300');
        buttons[q.correct].classList.add('bg-emerald-950', 'border-emerald-500', 'text-emerald-300');
      }

      // Show Character Image & Corporate Lesson
      const imgContainer = document.getElementById('imgContainer');
      const charImg = document.getElementById('charImg');
      if (q.image && q.image.trim() !== "") {
        charImg.src = q.image;
        imgContainer.classList.remove('hidden');
      } else {
        imgContainer.classList.add('hidden');
      }

      document.getElementById('charTitle').innerText = "पात्र: " + q.character;
      document.getElementById('charLesson').innerText = q.lesson;
      document.getElementById('revealBox').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        showQuestion(currentIndex);
      } else {
        document.getElementById('quizCard').classList.add('hidden');
        document.getElementById('resultCard').classList.remove('hidden');
        document.getElementById('finalScore').innerText = `तुम्हाला ${questions.length} पैकी ${score} गुण मिळाले आहेत.`;
      }
    }

    loadQuestions();
  </script>
</body>
</html>
